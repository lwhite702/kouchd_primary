name: Release integrity
# For post-deployment smoke tests and emergency rollback procedures,
# refer to docs/internal/ROLLBACK_RUNBOOK.md
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web verification and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values so the environment check and build run without real keys.
    env:
      NEXT_PUBLIC_CONVEX_URL: https://dummy-test.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
      CLERK_JWT_ISSUER_DOMAIN: https://dummy.clerk.accounts.dev
      SUBSCRIPTION_EXPECTED_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify:
    name: iOS release integrity and simulator build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run release:check
        env:
          NEXT_PUBLIC_CONVEX_URL: https://dummy-test.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          CLERK_JWT_ISSUER_DOMAIN: https://dummy.clerk.accounts.dev
          SUBSCRIPTION_EXPECTED_ENVIRONMENT: sandbox
      - run: ruby -c ios/fastlane/Fastfile
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - run: xcodebuild -project ios/Kouchd.xcodeproj -scheme Kouchd -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
