name: Release integrity
# For post-deployment smoke tests and emergency rollback procedures,
# refer to docs/internal/ROLLBACK_RUNBOOK.md
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web verification and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Placeholder values so the environment check and build run without real keys.
    env:
      NEXT_PUBLIC_CONVEX_URL: https://dummy-test.convex.cloud
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
      CLERK_SECRET_KEY: sk_test_dummy
      CLERK_JWT_ISSUER_DOMAIN: https://dummy.clerk.accounts.dev
      SUBSCRIPTION_EXPECTED_ENVIRONMENT: sandbox
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run verify:env
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  verify:
    name: iOS release integrity and simulator build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run release:check
        env:
          NEXT_PUBLIC_CONVEX_URL: https://dummy-test.convex.cloud
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dummy
          CLERK_SECRET_KEY: sk_test_dummy
          CLERK_JWT_ISSUER_DOMAIN: https://dummy.clerk.accounts.dev
          SUBSCRIPTION_EXPECTED_ENVIRONMENT: sandbox
      - run: ruby -c ios/fastlane/Fastfile
      - run: brew install xcodegen
      - run: xcodegen generate --spec ios/project.yml
      - run: xcodebuild -project ios/Kouchd.xcodeproj -scheme Kouchd -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  deploy-verify:
    name: Production deploy smoke test
    # Vercel deploys main through its Git integration; this job checks what it shipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      deployments: read
    steps:
      - uses: actions/checkout@v4
      - name: Wait for the Vercel production deployment of this commit
        uses: actions/github-script@v7
        with:
          script: |
            const deadline = Date.now() + 25 * 60 * 1000;
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            while (Date.now() < deadline) {
              const { data: deployments } = await github.rest.repos.listDeployments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: context.sha,
                per_page: 20,
              });
              const production = deployments.filter((d) => /^production/i.test(d.environment));
              for (const deployment of production) {
                const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  deployment_id: deployment.id,
                  per_page: 1,
                });
                const state = statuses[0]?.state;
                if (state === "success") {
                  core.info(`Production deployment ready: ${statuses[0].environment_url ?? deployment.environment}`);
                  return;
                }
                if (state === "failure" || state === "error") {
                  core.setFailed(`Vercel production deployment ${state} for ${context.sha}`);
                  return;
                }
              }
              core.info("Waiting for the Vercel production deployment…");
              await sleep(20_000);
            }
            core.setFailed("Timed out waiting for the Vercel production deployment of this commit.");
      - name: Smoke test production
        run: ./scripts/smoke.sh https://app.kouchd.com
      - name: Alert on failure
        if: failure()
        env:
          DEPLOY_ALERT_WEBHOOK_URL: ${{ secrets.DEPLOY_ALERT_WEBHOOK_URL }}
        run: |
          if [ -z "${DEPLOY_ALERT_WEBHOOK_URL}" ]; then
            echo "::warning::DEPLOY_ALERT_WEBHOOK_URL is not set; no alert sent."
            exit 0
          fi
          curl -sS -X POST -H 'Content-Type: application/json' \
            --data "{\"text\":\"Kouchd production smoke test failed for ${GITHUB_SHA::7}: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}" \
            "${DEPLOY_ALERT_WEBHOOK_URL}"
