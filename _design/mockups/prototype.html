<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kouchd prototype</title>
<style>
:root{--cream:#f7f2e9;--forest:#174e39;--ink:#16241e;--muted:#69716a;--lime:#def25f;--line:#dfddd5;--white:#fff}*{box-sizing:border-box}body{margin:0;background:#d9ddd7;color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif}.stage{min-height:100vh;display:grid;place-items:center;padding:24px}.phone{width:390px;height:844px;overflow:hidden;border:10px solid #111;border-radius:42px;background:var(--cream);box-shadow:0 18px 55px #21352b55;position:relative}.screen{height:100%;overflow:auto;padding:22px 20px 28px}.brand{font-weight:800;letter-spacing:-.04em}.top{display:flex;align-items:center;min-height:34px;justify-content:space-between}.top button,.text-button{border:0;background:none;color:var(--forest);font-weight:700;padding:8px 0}.h1{font-size:33px;line-height:1.05;letter-spacing:-.05em;font-weight:800;margin:22px 0 12px}.h2{font-size:23px;font-weight:800;letter-spacing:-.03em}.muted{color:var(--muted)}.mark{width:64px;height:64px;border-radius:20px;background:var(--forest);color:var(--lime);display:grid;place-items:center;font-size:30px;font-weight:800;margin-top:22px}.card{background:var(--white);border-radius:24px;padding:18px;margin:14px 0;box-shadow:0 1px 0 #00000008}.hero{background:var(--forest);color:#fff;border-radius:24px;padding:20px;margin:18px 0}.pill{display:inline-block;background:var(--lime);color:var(--forest);border-radius:99px;padding:6px 10px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.button{width:100%;border:0;border-radius:16px;background:var(--forest);color:#fff;font-weight:800;font-size:16px;padding:15px;margin-top:10px}.button.secondary{background:#e8ece7;color:var(--forest)}.button.ghost{background:transparent;color:var(--forest);border:1px solid var(--line)}.dots{display:flex;gap:8px;justify-content:center;margin:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--line)}.dot.on{background:var(--forest)}.field{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;margin:6px 0 12px;color:var(--ink);font:inherit}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.tabs{position:absolute;bottom:0;left:0;right:0;height:76px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 5px 8px}.tab{border:0;background:none;color:var(--muted);font:12px inherit}.tab.on{color:var(--forest);font-weight:800}.tab b{display:block;font-size:20px;line-height:25px}.sheet{position:absolute;inset:0;background:#0006;display:flex;align-items:flex-end}.sheet>div{background:var(--cream);width:100%;border-radius:28px 28px 0 0;padding:24px 20px 28px;max-height:78%;overflow:auto}.close{float:right;border:0;background:none;font-size:22px;color:var(--muted)}.choice{cursor:pointer}.small{font-size:13px}.check{color:var(--forest);font-weight:700}
</style></head>
<body><main class="stage"><div class="phone" id="app"></div></main>
<script>
const app=document.getElementById('app');let screen='intro';let step=0;let tab='Home';let sheet=null;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function button(label,action,cls='button'){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function shell(content,nav=''){return `<section class="screen">${content}</section>${nav}`}
function intro(){let titles=['A shared stay.\nOn the same page.','Good stays start\nwith clarity.','Clear records.\nFewer awkward asks.','Make the everyday\nfeel more shared.'];let desc=["Staying with someone—or opening your home? Keep expectations, contributions and everyday plans in one place.",'Agree on dates, house guidelines and contributions before the stay begins. Revisit changes together.','Record contributions made outside Kouchd. The people involved confirm or dispute the shared record.','Coordinate chores, check-ins and occupied nights. Keep the little things from becoming a guessing game.'];let preview=[`<div class="hero"><span class="pill">A little less guesswork</span><p class="h2">Agree on the stay.<br>Keep a clear record.<br>Share the everyday.</p><p>For hosts and guests, together.</p></div>`,`<div class="card"><b>Alex’s stay</b><p class="muted">Oct 4 – Oct 18 · Maple House</p><hr><span class="check">✓ Shared expectations accepted</span></div><div class="card"><b>One place for the details</b><p>Stay dates · House guide<br>Agreements · Schedule changes</p></div>`,`<div class="card"><span class="pill">Your shared record</span><p class="h2">$120 confirmed</p><p class="muted">Alex + Jordan · This stay</p></div><div class="card"><div class="row"><span class="muted">Weekly contribution</span><b>$60</b></div><p class="muted small">Oct 11 · Pending confirmation</p></div><p class="muted small">Kouchd records contributions. It does not move money.</p>`,`<div class="card"><b>✓ Kitchen reset</b><p class="muted">Alex · Completed today</p><hr><b>○ Take out recycling</b><p class="muted">Jordan · Due tomorrow</p></div><div class="card"><b>Small contributions count.</b><p>Earn points for approved chores and claim rewards your host offers.</p></div>`];return shell(`<div class="top"><span class="brand">kouchd</span>${button(step===0?'Skip':'Back',step===0?'role':'back','text-button')}</div><div class="mark">⌂</div><p class="pill">${step?`0${step} / ${['Your stay','Contributions','Everyday living'][step-1]}`:'Shared stays'}</p><h1>${titles[step].replace(/\n/g,'<br>')}</h1><p class="muted">${desc[step]}</p>${preview[step]}<div class="dots">${[0,1,2,3].map(i=>`<i class="dot ${i===step?'on':''}"></i>`).join('')}</div>${button(step===0?'See how Kouchd works':step===3?'Let’s get started':'Continue',step===3?'role':'next')}${button('Already have an account? Sign in','welcome','text-button')}`)}
function role(){return shell(`<div class="top"><span class="brand">kouchd</span>${button('Back','intro','text-button')}</div><h1>How are you<br>making room?</h1><p class="muted">Start with your role in this stay. You can host and be a guest in different stays.</p><div class="card"><div class="h2">I’m hosting</div><p>Create a stay, set expectations and invite your guests.</p>${button('Create a stay','create')}</div><div class="card"><div class="h2">I’m staying with someone</div><p>Join using the invitation your host shared.</p>${button('Join a stay','join','button secondary')}</div>`)}
function welcome(){return shell(`<h1>Make room for<br>what matters.</h1><div class="card"><span class="pill">Kouchd</span><p class="h2">A calmer way to share a stay.</p><p class="muted">Keep agreements, contributions, chores, and check-ins together.</p>${button('Continue to your stay','home')}</div>${button('About Kouchd','about','button ghost')}`)}
function create(){return shell(`<div class="top"><button class="text-button" data-action="role">‹ Back</button><span class="brand">Create a stay</span></div><h1>Start a shared stay.</h1><p class="muted">Set the dates, contribution rhythm, and house notes for your guests.</p><label>Stay name<input class="field" value="Maple House"></label><label>Dates<input class="field" value="Oct 4 – Oct 18"></label><label>Contribution rhythm<input class="field" value="Weekly"></label><label>House notes<textarea class="field" rows="3">Shared expectations go here.</textarea></label>${button('Save and open Home','home')}`)}
function join(){sheet='join';render()}
function main(){let data={Home:['Good morning, Alex.','Maple House · Oct 4 – Oct 18','Shared expectations accepted','2 things need your attention'],Ledger:['Your shared record','Contributions happen outside Kouchd. Keep the record clear.','$120 confirmed','Weekly contribution · $60'],Chores:['Everyday living','Small contributions count.','Kitchen reset · Alex · Completed today','Take out recycling · Jordan · Due tomorrow'],Stay:['Maple House','Stay details and house guide','Oct 4 – Oct 18','House notes · Agreements · Schedule changes']}[tab];return shell(`<div class="top"><span class="brand">kouchd</span>${button('＋','plus','text-button')}</div><h1>${data[0]}</h1><p class="muted">${data[1]}</p><div class="card"><span class="pill">${tab}</span><p class="h2">${data[2]}</p><p class="muted">${data[3]}</p></div><div class="card"><b>Keep the everyday shared.</b><p class="muted">Review the details together and return when something changes.</p></div>`,`<nav class="tabs">${['Home','Ledger','Chores','Stay'].map(t=>`<button class="tab ${tab===t?'on':''}" data-tab="${t}"><b>${{Home:'⌂',Ledger:'▤',Chores:'✓',Stay:'⌂'}[t]}</b>${t}</button>`).join('')}</nav>`)}
function about(){return shell(`<div class="top"><button class="text-button" data-action="welcome">‹ Back</button></div><h1>Make room<br>for clarity.</h1><p class="muted">Kouchd helps hosts and guests manage a shared stay with clearer expectations and fewer scattered conversations.</p><div class="card"><b>Your stay, in one place</b><p>Stay · Agreements and house details<br>Ledger · Outside contribution records<br>Chores · Tasks, check-ins and rewards<br>Home · What needs your attention</p></div><p class="muted small">Payments happen outside Kouchd. Contribution records can be confirmed or disputed by the people involved.</p>`)}
function plus(){sheet='plus';render()}
function render(){let body=screen==='intro'?intro():screen==='role'?role():screen==='welcome'?welcome():screen==='create'?create():screen==='home'?main():screen==='about'?about():main();app.innerHTML=body+(sheet?`<div class="sheet"><div><button class="close" data-action="close">×</button>${sheet==='join'?`<h2>Join with a code</h2><p class="muted">Open your host’s invite link or enter their referral code.</p><input class="field" placeholder="Referral code">${button('Join stay','home')}`:`<h2>Kouchd Plus</h2><p class="muted">Early Access Preview</p><p>Subscription billing is currently in rollout and invite-only. Stay tuned for wider availability.</p>${button('Got it','close','button secondary')}`}</div></div>`:'');}
app.addEventListener('click',e=>{let a=e.target.closest('[data-action]')?.dataset.action;if(a){if(a==='next')step=Math.min(3,step+1);else if(a==='back')step=Math.max(0,step-1);else if(a==='join'){sheet='join'}else if(a==='plus'){sheet='plus'}else if(a==='close'){sheet=null}else{screen=a;step=0;sheet=null}render()}let t=e.target.closest('[data-tab]')?.dataset.tab;if(t){screen='home';tab=t;render()}});render();
</script></body></html>
